<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelly Planet | globaldaily</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif; color: var(--text-color);
            user-select: none; touch-action: none;
        }

        canvas { display: block; }

        #ui { position: absolute; top: 30px; left: 30px; pointer-events: none; z-index: 2; }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        .inst { font-size: 0.7rem; color: #888; margin-top: 5px; }

        /* Control Panel */
        #controls {
            position: absolute; top: 30px; right: 30px; width: 240px;
            background: var(--panel-bg); backdrop-filter: blur(20px);
            padding: 20px; border-radius: 15px; z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
        }

        .control-group { margin-bottom: 15px; }
        label {
            display: flex; justify-content: space-between;
            font-size: 0.65rem; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 6px; font-weight: 700; color: #ccc;
        }

        input[type="range"], input[type="color"] { width: 100%; cursor: pointer; accent-color: #fff; }
        input[type="color"] { height: 25px; border: none; background: none; padding: 0; }

        button.reset-btn {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05); color: #fff;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;
            font-size: 0.7rem; letter-spacing: 1px; transition: 0.2s; margin-bottom: 15px;
        }
        button.reset-btn:hover { background: #fff; color: #000; }

        /* User Requested Support Section */
        .support-section {
            margin-top: 10px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .support-button {
            display: inline-block; width: 100%; padding: 10px 0;
            border: 1px solid rgba(255,255,255,0.3); color: #fff;
            text-decoration: none; font-size: 0.75rem; border-radius: 8px;
            transition: 0.3s; font-weight: 700;
        }
        .support-button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Jelly Planet</h1>
        <div class="inst">Click: Create | Double Click: Split | Drag: Poke</div>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Jelly Color</label>
            <input type="color" id="jellyColor" value="#ff4d8d">
        </div>
        <div class="control-group">
            <label>Transparency</label>
            <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.8">
        </div>
        <div class="control-group">
            <label>Firmness (Stiffness)</label>
            <input type="range" id="firmness" min="0.01" max="0.2" step="0.01" value="0.05">
        </div>
        <div class="control-group">
            <label>Jiggle (Elasticity)</label>
            <input type="range" id="jiggle" min="0.85" max="0.99" step="0.01" value="0.94">
        </div>
        
        <button class="reset-btn" onclick="clearAll()">RESET WORLD</button>

        <div class="support-section">
            <a href="https://buymeacoffee.com/globaldaily" target="_blank" class="support-button">🍵 Support Creator</a>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const ui = {
            color: document.getElementById('jellyColor'),
            opacity: document.getElementById('opacity'),
            firmness: document.getElementById('firmness'),
            jiggle: document.getElementById('jiggle')
        };

        let width, height, jellies = [];
        let mouse = { x: -1000, y: -1000 };

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r},${g},${b}`;
        }

        class Point {
            constructor(x, y) {
                this.x = x; this.y = y; this.ox = x; this.oy = y;
            }
            update(damp) {
                let vx = (this.x - this.ox) * damp;
                let vy = (this.y - this.oy) * damp;
                this.ox = this.x; this.oy = this.y;
                this.x += vx; this.y += vy;

                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 80) {
                    let angle = Math.atan2(dy, dx);
                    let force = (80 - dist) * 0.06;
                    this.x -= Math.cos(angle) * force;
                    this.y -= Math.sin(angle) * force;
                }
                if (this.x < 0) this.x = 0; else if (this.x > width) this.x = width;
                if (this.y < 0) this.y = 0; else if (this.y > height) this.y = height;
            }
        }

        class Jelly {
            constructor(x, y, r, color) {
                this.x = x; this.y = y; this.radius = r; this.color = color;
                this.points = []; this.numPoints = 20;
                for (let i = 0; i < this.numPoints; i++) {
                    const a = (i / this.numPoints) * Math.PI * 2;
                    this.points.push(new Point(x + Math.cos(a) * r, y + Math.sin(a) * r));
                }
                this.core = new Point(x, y);
            }
            update() {
                const damp = parseFloat(ui.jiggle.value);
                const stiff = parseFloat(ui.firmness.value);
                this.core.update(damp);
                let cx = 0, cy = 0;
                this.points.forEach((p, i) => {
                    p.update(damp);
                    const a = (i / this.numPoints) * Math.PI * 2;
                    const tx = this.core.x + Math.cos(a) * this.radius;
                    const ty = this.core.y + Math.sin(a) * this.radius;
                    p.x += (tx - p.x) * stiff; p.y += (ty - p.y) * stiff;
                    const next = this.points[(i + 1) % this.numPoints];
                    const dist = Math.hypot(next.x - p.x, next.y - p.y);
                    const desired = (Math.PI * 2 * this.radius) / this.numPoints;
                    const diff = (dist - desired) * 0.4;
                    const nx = ((next.x - p.x) / dist) * diff;
                    const ny = ((next.y - p.y) / dist) * diff;
                    p.x += nx; p.y += ny; next.x -= nx; next.y -= ny;
                    cx += p.x; cy += p.y;
                });
                this.x = cx / this.numPoints; this.y = cy / this.numPoints;
            }
            draw() {
                const rgb = hexToRgb(this.color);
                const alpha = ui.opacity.value;
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 0; i < this.points.length; i++) {
                    const p1 = this.points[i];
                    const p2 = this.points[(i + 1) % this.points.length];
                    ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
                }
                ctx.closePath();
                const grad = ctx.createRadialGradient(this.core.x - this.radius*0.3, this.core.y - this.radius*0.3, 0, this.core.x, this.core.y, this.radius*1.5);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha*0.4})`);
                grad.addColorStop(0.2, `rgba(${rgb}, ${alpha})`);
                grad.addColorStop(1, `rgba(${rgb.split(',').map(v=>v*0.4).join(',')}, ${alpha})`);
                ctx.fillStyle = grad; ctx.fill();
            }
            isInside(x, y) { return Math.hypot(x - this.x, y - this.y) < this.radius; }
        }

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        function createJelly(x, y) { jellies.push(new Jelly(x, y, 80, ui.color.value)); }
        function clearAll() { jellies = []; }
        function splitJelly(j) {
            const idx = jellies.indexOf(j);
            if(idx > -1 && j.radius > 30) {
                jellies.splice(idx, 1);
                const nr = j.radius * 0.7;
                jellies.push(new Jelly(j.x - nr, j.y, nr, j.color));
                jellies.push(new Jelly(j.x + nr, j.y, nr, j.color));
            }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', e => {
            if(e.target.closest('#controls')) return;
            let hit = false;
            for(let j of jellies) if(j.isInside(mouse.x, mouse.y)) hit = true;
            if(!hit) createJelly(mouse.x, mouse.y);
        });
        window.addEventListener('dblclick', () => {
            for(let i=jellies.length-1; i>=0; i--) if(jellies[i].isInside(mouse.x, mouse.y)) { splitJelly(jellies[i]); break; }
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            if(jellies.length > 10) jellies.shift();
            jellies.forEach(j => { j.update(); j.draw(); });
            requestAnimationFrame(animate);
        }

        resize(); createJelly(width/2, height/2); animate();
    </script>
</body>
</html>
